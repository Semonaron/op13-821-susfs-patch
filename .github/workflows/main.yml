name: Verify OnePlus 13 Image

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Check input image
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "init_boot.img" ]; then
            echo "::error::init_boot.img not found in repository root"
            echo "Current directory:"
            pwd
            echo "Files:"
            ls -lah
            exit 1
          fi

          echo "Found init_boot.img"
          ls -lh init_boot.img
          file init_boot.img

      - name: 3. Prepare tools directory
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            file \
            unzip \
            zip \
            cpio \
            bsdiff

          mkdir -p tools
          ls -lah tools

      - name: 4. Validate downloads
        shell: bash
        run: |
          set -euo pipefail

          cd tools

          # 不再使用：
          # wget https://github.com
          #
          # 任何工具都必须使用“具体文件”的下载地址。
          # 下载后先检查 HTTP 内容和文件类型。

          echo "Tools directory:"
          ls -lah

      - name: 5. Create output package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out
          cp init_boot.img out/init_boot.img

          cd out
          zip -9 ../OnePlus13_init_boot_backup.zip init_boot.img

          cd ..
          ls -lh OnePlus13_init_boot_backup.zip

      - name: 6. Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus13-init_boot
          path: OnePlus13_init_boot_backup.zip
          if-no-files-found: error
