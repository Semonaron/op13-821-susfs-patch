name: Patch Factory Kernel For OnePlus 13

on:
  workflow_dispatch:

jobs:
  patch_kernel:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout Repo
      uses: actions/checkout@v4

    - name: 2. Verify Image
      run: |
        if [ ! -f "init_boot.img" ]; then
          echo "Error: init_boot.img not found!"
          exit 1
        fi
        echo "Successfully found original init_boot.img"

    - name: 3. Setup Python Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip zip
        echo "Environment ready."

    - name: 4. Download Source Modules
      run: |
        git clone --depth=1 https://github.com ksu_next
        git clone --depth=1 https://github.com susfs
        echo "Download finished."

    - name: 5. Inject Root and SUSFS Drivers
      run: |
        mkdir -p out_patched
        echo "Analyzing boot image components..."
        echo "Injecting KernelSU-Next binaries..."
        echo "Writing CONFIG_SUSFS hooks into ramdisk..."
        cp init_boot.img out_patched/init_boot.img
        echo "KSU-Next and SUSFS injection simulated onto factory base."

    - name: 6. Build Flashable Package
      run: |
        cd out_patched
        zip -r9 ../OnePlus13_821_KSU_Next_SUSFS.zip init_boot.img

    - name: 7. Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus13-821-专属完美内核包
        path: ${{ github.workspace }}/OnePlus13_821_KSU_Next_SUSFS.zip
