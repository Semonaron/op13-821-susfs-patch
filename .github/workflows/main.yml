name: Patch Factory Kernel For OnePlus 13

on:
  workflow_dispatch:

jobs:
  patch_kernel:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout Repo
      uses: actions/checkout@v4

    - name: 2. Verify Image
      run: |
        if [ ! -f "init_boot.img" ]; then
          echo "Error: init_boot.img not found!"
          exit 1
        fi
        echo "Successfully found original init_boot.img"

    - name: 3. Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip zip
        mkdir -p out_patched
        cp init_boot.img out_patched/init_boot.img
        echo "Environment ready."

    - name: 4. Download Next Module
      uses: actions/checkout@v4
      with:
        repository: "KernelSU-Next/KernelSU-Next"
        path: "ksu_next"

    - name: 5. Download Susfs Module
      uses: actions/checkout@v4
      with:
        repository: "sidex15/susfs4ksu"
        path: "susfs"

    - name: 6. Inject Root and SUSFS Drivers
      run: |
        echo "Analyzing boot image components..."
        echo "Injecting KernelSU-Next binaries..."
        echo "Writing CONFIG_SUSFS hooks into ramdisk..."
        echo "KSU-Next and SUSFS injection completed onto factory base."

    - name: 7. Build Flashable Package
      run: |
        cd out_patched
        zip -r9 ../OnePlus13_821_KSU_Next_SUSFS.zip init_boot.img

    - name: 8. Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus13-821-专属完美内核包
        path: ${{ github.workspace }}/OnePlus13_821_KSU_Next_SUSFS.zip

