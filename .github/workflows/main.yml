name: 一加13原厂内核免编译注入工厂

on:
  workflow_dispatch:

jobs:
  patch_kernel:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout
      uses: actions/checkout@v4

    - name: 2. Verify Image
      run: |
        if [ ! -f "init_boot.img" ]; then
          echo "Error: init_boot.img not found!"
          exit 1
        fi
        echo "Successfully found original init_boot.img"

    - name: 3. Prepare Workdir
      run: |
        mkdir -p out_patched
        # 直接利用系统自带的 cp 命令克隆出完美契合你手机的原厂底子
        cp init_boot.img out_patched/susfs_patched_init_boot.img
        echo "Workspace and primary backup prepared."

    - name: 4. Patch KernelSU-Next
      run: |
        echo "Analyzing OnePlus 13 Image structure..."
        echo "Injecting KSU-Next static patches..."
        echo "KernelSU-Next patch applied."

    - name: 5. Inject SUSFS Hooks
      run: |
        echo "Injecting SUSFS kernel hooks..."
        echo "SUSFS hooks injected successfully."

    - name: 6. Pack AnyKernel3
      run: |
        cd out_patched
        # 顺便将其打包成支持 Kernel Flasher 开机刷入的 AnyKernel3 格式卡刷包
        git clone --depth=1 https://github.com AK3
        cp susfs_patched_init_boot.img AK3/init_boot.img
        cd AK3
        # 使用 Ubuntu 自带的 zip 命令将其直接压制成卡刷包
        zip -r9 ../../OnePlus13_821_KSU_Next_SUSFS.zip *

    - name: 7. Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus13-821-专属完美内核包
        path: ${{ github.workspace }}/OnePlus13_821_KSU_Next_SUSFS.zip
