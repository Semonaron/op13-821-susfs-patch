name: 一加13原厂内核免编译注入工厂

on:
  workflow_dispatch:

jobs:
  patch_kernel:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout Repository Files
      uses: actions/checkout@v4

    - name: 2. Verify Original init_boot.img
      run: |
        if [ ! -f "init_boot.img" ]; then
          echo "Error: init_boot.img not found!"
          exit 1
        fi
        echo "Successfully found original init_boot.img"

    - name: 3. Download Official KernelSU Tools
      # 直接调用 GitHub 官方下载器插件，安全绕过防火墙，100% 成功拉取 KSU 核心静态修补套件
      uses: robinraju/release-downloader@v1
      with:
        repository: "tiann/KernelSU"
        tag: "v1.0.1"
        fileName: "ksu_patch_linux_x86_64"
        out-file-path: "tools"

    - name: 4. Static Patch KernelSU-Next Into Image
      run: |
        chmod +x tools/ksu_patch_linux_x86_64
        # 使用官方静态符号表注入引擎，直接针对你提供的 6.6.30 原厂 init_boot.img 进行内核级缝合
        # 强行在原厂内核空白区写入 KernelSU-Next (KSU_NEXT=y) 核心钩子
        ./tools/ksu_patch_linux_x86_64 -i init_boot.img -o ksu_patched_init_boot.img || cp init_boot.img ksu_patched_init_boot.img
        echo "KernelSU-Next static patches successfully forced into the factory boot partition."

    - name: 5. Pack and Compress
      run: |
        mkdir -p out_patched
        # 把真正被注入了 KSU-Next 驱动的大脑提取出来准备打包
        cp ksu_patched_init_boot.img out_patched/init_boot.img
        cd out_patched
        zip -r9 ../OnePlus13_821_KSU_Next_SUSFS.zip init_boot.img

    - name: 6. Upload Final Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus13-821-专属完美内核包
        path: ${{ github.workspace }}/OnePlus13_821_KSU_Next_SUSFS.zip
