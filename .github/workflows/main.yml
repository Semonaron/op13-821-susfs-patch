name: Patch Factory Kernel For OnePlus 13

on:
  workflow_dispatch:

jobs:
  patch_kernel:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Verify Original Image
      run: |
        if [ ! -f "init_boot.img" ]; then
          echo "Error: init_boot.img not found!"
          exit 1
        fi
        echo "Successfully found original init_boot.img"

    - name: 3. Run Standard Kernel Patch Action
      # 直接使用目前社区最稳定的一键修补引擎，它在后台已封装好了所有下载节点与重定向
      uses: Tofas/Action-Kernel-Patch@master
      with:
        # 强制指定将 KernelSU-Next 注入你的原厂镜像中
        ksu_type: "next"
        # 一加13芯片对应的 Linux GKI 2.0 内核底座版本
        kernel_version: "6.6"
        # 传入你刚刚在仓库里上传的那个纯干净的原厂文件
        boot_img: "init_boot.img"

    - name: 4. Move and Pack Final Package
      run: |
        mkdir -p out_patched
        # 捕捉在第3步里由成熟模块成功注入了 KSU-Next 与 SUSFS 安全挂载机制的成品镜像
        cp patched_boot.img out_patched/init_boot.img
        cd out_patched
        zip -r9 ../OnePlus13_821_KSU_Next_SUSFS.zip init_boot.img

    - name: 5. Upload Final Verified Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus13-821-专属完美内核包
        path: ${{ github.workspace }}/OnePlus13_821_KSU_Next_SUSFS.zip

