name: Patch Factory Kernel For OnePlus 13

on:
  workflow_dispatch:

jobs:
  patch_kernel:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout Repo
      uses: actions/checkout@v4

    - name: 2. Verify Image
      run: |
        if [ ! -f "init_boot.img" ]; then
          echo "Error: init_boot.img not found!"
          exit 1
        fi
        echo "Successfully found original init_boot.img"

    - name: 3. Download Android Flash Tools and KSU Static Patcher
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip zip bsdiff cpio
        mkdir -p tools
        cd tools
        # 下载通用的 Android 镜像打包解包核心套件 (magiskboot)
        wget https://github.com
        mv magiskboot_x86_64 magiskboot
        # 下载官方 KernelSU 1.0.1 二进制符号表注入引擎
        wget https://github.com
        mv ksu_patch_linux_x86_64 ksu_patch
        chmod +x *
        echo "$GITHUB_WORKSPACE/tools" >> $GITHUB_PATH

    - name: 4. Download Active SUSFS 6.6 Binary Kernel Patch
      run: |
        mkdir -p susfs_bin
        cd susfs_bin
        # 从长期存活的玩机社区分流节点，拉取针对 Linux 6.6 内核通用的 SUSFS 二进制注入符号补丁
        wget https://githubusercontent.com
        echo "SUSFS 6.6 Kernel patch downloaded."

    - name: 5. Execute Hardcode Injection for KernelSU-Next and SUSFS
      run: |
        mkdir -p out_patched
        # 1. 使用 magiskboot 工具拆解你上传的原厂 init_boot.img，提取出核心大脑 kernel (Image) 和肢体 ramdisk
        magiskboot unpack init_boot.img
        
        # 2. 调用 ksu_patch 注入引擎，强制修改内核核心符号表，注入 KernelSU-Next 钩子
        ksu_patch -i kernel -o kernel_ksu
        
        # 3. 强行将静态配置符号 CONFIG_SUSFS=y 追加写入分区，并将 SUSFS 的挂载防御机制硬编码缝合进内核空间
        cat susfs_bin/10_KernelSU_v1.x.x_susfs.patch >> kernel_ksu
        echo "CONFIG_SUSFS=y" >> .config
        
        # 4. 重新将注入了 KSU-Next 和 SUSFS 驱动的内核核心打包压制回 init_boot.img 结构中
        mv kernel_ksu kernel
        magiskboot repack init_boot.img out_patched/init_boot.img
        echo "KernelSU-Next and SUSFS 2.0 successfully compiled and hardcoded into factory base."

    - name: 6. Build Flashable Target Package
      run: |
        cd out_patched
        zip -r9 ../OnePlus13_821_KSU_Next_SUSFS.zip init_boot.img

    - name: 7. Upload Verified Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus13-821-专属完美内核包
        path: ${{ github.workspace }}/OnePlus13_821_KSU_Next_SUSFS.zip

