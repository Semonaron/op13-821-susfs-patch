name: 一加13原厂内核免编译注入工厂

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Run Official Kernel Patch Action
      # 直接调用全网最成熟的内核修补自动化流水线
      uses: Tofas/Action-Kernel-Patch@master
      with:
        # 指定你要注入的 Root 权限类型为 KernelSU-Next
        ksu_type: "next"
        # 强制指定手机芯片对应的 Linux 内核版本，一加13为 6.6
        kernel_version: "6.6"
        # 告诉它对仓库里的哪一个镜像文件进行静默注入
        boot_img: "init_boot.img"

    - name: 3. Move and Pack Final Image
      run: |
        mkdir -p out_patched
        # 把流水线完美注入了 KSU-Next 和隐藏挂载点的成品镜像捉过来
        cp patched_boot.img out_patched/init_boot.img
        cd out_patched
        zip -r9 ../OnePlus13_821_KSU_Next_SUSFS.zip init_boot.img

    - name: 4. Upload Finial Kernel Package
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus13-821-专属完美内核包
        path: ${{ github.workspace }}/OnePlus13_821_KSU_Next_SUSFS.zip
