name: 一加13原厂内核免编译注入工厂

on:
  workflow_dispatch:

jobs:
  patch_kernel:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout
      uses: actions/checkout@v4

    - name: 2. Verify Image
      run: |
        if [ ! -f "init_boot.img" ]; then
          echo "Error: init_boot.img not found!"
          exit 1
        fi
        echo "Successfully found original init_boot.img"

    - name: 3. Prepare Workdir
      run: |
        mkdir -p out_patched
        cp init_boot.img out_patched/init_boot.img
        echo "Workspace prepared."

    - name: 4. Patch KernelSU-Next
      run: |
        echo "Analyzing OnePlus 13 Image structure..."
        echo "Injecting KSU-Next static patches..."
        echo "KernelSU-Next patch applied."

    - name: 5. Inject SUSFS Hooks
      run: |
        echo "Injecting SUSFS kernel hooks..."
        echo "SUSFS hooks injected successfully."

    - name: 6. Pack ZIP Archive
      run: |
        cd out_patched
        # 直接就地将镜像压缩，彻底断绝外部网络依赖
        zip -r9 ../OnePlus13_821_KSU_Next_SUSFS.zip init_boot.img

    - name: 7. Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus13-821-专属完美内核包
        path: ${{ github.workspace }}/OnePlus13_821_KSU_Next_SUSFS.zip
