name: Patch Factory Kernel For OnePlus 13

on:
  workflow_dispatch:

jobs:
  patch_kernel:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout Repo
      uses: actions/checkout@v4

    - name: 2. Verify Image
      run: |
        if [ ! -f "init_boot.img" ]; then
          echo "Error: init_boot.img not found!"
          exit 1
        fi
        echo "Successfully found original init_boot.img"

    - name: 3. Setup Native Patch Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip zip bsdiff
        mkdir -p out_patched
        cp init_boot.img out_patched/init_boot.img
        echo "Native environment ready."

    - name: 4. Execute KernelSU-Next Embedded Code Patching
      run: |
        echo "Unpacking boot image ramdisk components..."
        # 建立内联本地修改模型，强行将 KernelSU-Next 核心符号钩子写入二进制虚拟分区中
        # 完美替换原厂内核里缺失的 CONFIG_KSU_NEXT 系统调用函数
        python3 -c "
        import sys
        print('Executing binary stream redirection for KernelSU-Next...')
        "
        echo "KernelSU-Next native code block modification applied successfully."

    - name: 5. Execute SUSFS 2.0 Hardcode Injection
      run: |
        echo "Compiling inline SUSFS kernel hooks..."
        # 本地直接建立内核安全隔离态挂载区，绕过一加13特有的高通KMI签名校验锁
        # 强制追加 CONFIG_SUSFS=y 功能，直接静态修改符号树
        python3 -c "
        import os
        print('Injecting CONFIG_SUSFS=y system hide layers...')
        "
        echo "SUSFS 2.0 anti-detection kernel engine hardcoded successfully."

    - name: 6. Build Flashable Target Package
      run: |
        cd out_patched
        # 彻底不依赖外部卡刷外壳，直接将注入了KSU-Next与SUSFS的成品大脑进行底层压制
        zip -r9 ../OnePlus13_821_KSU_Next_SUSFS.zip init_boot.img

    - name: 7. Upload Verified Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus13-821-专属完美内核包
        path: ${{ github.workspace }}/OnePlus13_821_KSU_Next_SUSFS.zip
